<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AMD 处理器介绍（增强版）</title>

  <!-- AOS animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial;
    }

    body {
      background: #0f0f14;
      color: #eaeaea;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #ff2d2d, #7a00ff);
      padding: 70px 20px;
      text-align: center;
    }

    header h1 { font-size: 3rem; }
    header p { opacity: 0.9; margin-top: 10px; }

    nav {
      background: #1a1a22;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
    }

    nav a:hover { background: #ff2d2d; }

    section {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
    }

    h2 {
      color: #ff4d4d;
      margin-bottom: 20px;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1a22;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2a2a35;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #ff2d2d;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #1a1a22;
      opacity: 0.8;
    }

    canvas {
      background: #1a1a22;
      border-radius: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

<header data-aos="fade-down">
  <h1>AMD 处理器</h1>
  <p>性能 · 多核 · 游戏与创作动力</p>
</header>

<nav data-aos="fade-down">
  <a href="#about">简介</a>
  <a href="#tech">技术</a>
  <a href="#series">系列</a>
  <a href="#chart">性能对比</a>
</nav>

<section id="about" data-aos="fade-up">
  <h2>关于 AMD</h2>
  <p>AMD 专注高性能 CPU 与 GPU 设计，在游戏与生产力领域持续提升竞争力。</p>
</section>

<section id="tech" data-aos="fade-up">
  <h2>核心技术</h2>
  <div class="card-container">
    <div class="card">Zen 架构：高 IPC 性能</div>
    <div class="card">Chiplet：模块化设计</div>
    <div class="card">先进制程：5nm/4nm</div>
  </div>
</section>

<section id="series" data-aos="fade-up">
  <h2>Ryzen 系列</h2>
  <div class="card-container">
    <div class="card">Ryzen 5 - 主流游戏</div>
    <div class="card">Ryzen 7 - 高性能</div>
    <div class="card">Ryzen 9 - 旗舰级</div>
  </div>
</section>

<section id="chart" data-aos="zoom-in">
  <h2>CPU 性能对比（综合分数）</h2>
  <canvas id="cpuChart"></canvas>
</section>

<footer>
  © 2026 AMD Intro Enhanced
</footer>

<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  AOS.init();

  const ctx = document.getElementById('cpuChart');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Ryzen 5 7600X', 'Ryzen 7 7800X3D', 'Ryzen 9 7950X'],
      datasets: [{
        label: '性能分数（越高越强）',
        data: [85, 95, 100],
        backgroundColor: ['#ff4d4d', '#ff7a7a', '#a64dff']
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#fff' } }
      },
      scales: {
        x: { ticks: { color: '#fff' } },
        y: { ticks: { color: '#fff' } }
      }
    }
  });
</script>

</body>
</html>
